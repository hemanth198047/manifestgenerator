<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CasC Manifest Generator</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main>
    <h1>CasC Multi-Source Manifest Generator</h1>
    <p class="notice">
        Profile: <strong th:text="${profile.name()}">profile</strong>
        (<span th:text="${profile.confirmedAgainstOfficialSpec()} ? 'confirmed' : 'provisional, not confirmed against the official spec'">status</span>)
    </p>
    <ul>
        <li th:each="note : ${profile.notes()}" th:text="${note}">note</li>
    </ul>
    <p>The five-step wizard is not implemented yet.</p>
</main>
</body>
</html>
